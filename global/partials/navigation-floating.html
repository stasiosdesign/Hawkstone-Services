function initScalingHamburgerNavigation() {
  // Toggle Navigation
  document.querySelectorAll('[data-navigation-toggle="toggle"]').forEach(toggleBtn => {
    toggleBtn.addEventListener('click', () => {
      const navStatusEl = document.querySelector('[data-navigation-status]');
      if (!navStatusEl) return;
      if (navStatusEl.getAttribute('data-navigation-status') === 'not-active') {
        navStatusEl.setAttribute('data-navigation-status', 'active');
        // If you use Lenis you can 'stop' Lenis here: Example Lenis.stop();
      } else {
        navStatusEl.setAttribute('data-navigation-status', 'not-active');
        // If you use Lenis you can 'start' Lenis here: Example Lenis.start();
      }
    });
  });
  // Close Navigation
  document.querySelectorAll('[data-navigation-toggle="close"]').forEach(closeBtn => {
    closeBtn.addEventListener('click', () => {
      const navStatusEl = document.querySelector('[data-navigation-status]');
      if (!navStatusEl) return;
      navStatusEl.setAttribute('data-navigation-status', 'not-active');
      // If you use Lenis you can 'start' Lenis here: Example Lenis.start();
    });
  });
  // Key ESC - Close Navigation
  document.addEventListener('keydown', e => {
    if (e.keyCode === 27) {
      const navStatusEl = document.querySelector('[data-navigation-status]');
      if (!navStatusEl) return;
      if (navStatusEl.getAttribute('data-navigation-status') === 'active') {
        navStatusEl.setAttribute('data-navigation-status', 'not-active');
       // If you use Lenis you can 'start' Lenis here: Example Lenis.start();
      }
    }
  });
}
// Initialize Scaling Hamburger Navigation
document.addEventListener('DOMContentLoaded', function() {
  initScalingHamburgerNavigation();
});
</script>

          <script>
(() => {
  const SELECTORS = {
    nav: '[data-fixed-nav="true"]',
    showAfter: '[data-nav-show-after="true"]',
    hideAt: '[data-nav-hide-at="true"]',
  };
  const INTERACTIVE_SELECTOR =
    'a,button,input,select,textarea,label,[role="button"],[tabindex]:not([tabindex="-1"])';
  // Webflow Tablet and down = 991px and below
  const DISABLE_MQ = '(max-width: 991px)';
  const ST_ID = "fixedNavVisibility";
  function initFixedNavVisibility() {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);
    const navEls = Array.from(document.querySelectorAll(SELECTORS.nav));
    if (!navEls.length) return;
    const showAfterEl = document.querySelector(SELECTORS.showAfter);
    const hideAtEl = document.querySelector(SELECTORS.hideAt);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const setPointer = (enabled) => {
      const vw = window.innerWidth || 1;
      const vh = window.innerHeight || 1;
      const viewportArea = vw * vh;
      navEls.forEach((el) => {
        const rect = el.getBoundingClientRect();
        const area = rect.width * rect.height;
        const isLikelyWrapper = area > viewportArea * 0.15;
        if (!enabled) {
          el.style.pointerEvents = 'none';
          el.querySelectorAll(INTERACTIVE_SELECTOR).forEach((child) => {
            child.style.pointerEvents = 'none';
          });
          return;
        }
        if (isLikelyWrapper) {
          el.style.pointerEvents = 'none';
          const firstChild = el.firstElementChild;
          if (firstChild) firstChild.style.pointerEvents = 'auto';
          el.querySelectorAll(INTERACTIVE_SELECTOR).forEach((child) => {
            child.style.pointerEvents = 'auto';
          });
        } else {
          el.style.pointerEvents = 'auto';
          el.querySelectorAll(INTERACTIVE_SELECTOR).forEach((child) => {
            child.style.pointerEvents = '';
          });
        }
      });
    };
    const showNav = () => {
      setPointer(true);
      if (reduceMotion) {
        gsap.set(navEls, { autoAlpha: 1, clearProps: "transform" });
        return;
      }
      gsap.to(navEls, {
        autoAlpha: 1,
        y: 0,
        duration: 0.28,
        ease: "power2.out",
        overwrite: true
      });
    };
    const hideNav = () => {
      setPointer(false);
      if (reduceMotion) {
        gsap.set(navEls, { autoAlpha: 0 });
        return;
      }
      gsap.to(navEls, {
        autoAlpha: 0,
        y: -8,
        duration: 0.22,
        ease: "power2.out",
        overwrite: true
      });
    };
    // ----- enable/disable wiring (Tablet↓ disables the scroll behaviour) -----
    let listenersAttached = false;
    const onLoad = () => ScrollTrigger.refresh();
    const onResize = () => {
      const st = ScrollTrigger.getById(ST_ID);
      if (!st) return;
      setPointer(st.isActive || (!showAfterEl && !!hideAtEl));
    };
    const killScroll = () => {
      const existing = ScrollTrigger.getById(ST_ID);
      if (existing) existing.kill();
      gsap.killTweensOf(navEls);
      if (listenersAttached) {
        window.removeEventListener("load", onLoad);
        window.removeEventListener("resize", onResize);
        listenersAttached = false;
      }
    };
    const disableForTabletDown = () => {
      killScroll();
      // Force visible + interactive on Tablet↓ (no attribute-driven hide/show)
      setPointer(true);
      gsap.set(navEls, { autoAlpha: 1, clearProps: "transform" });
    };
    const enableForDesktop = () => {
      killScroll();
      // If no triggers, do nothing (nav stays visible)
      if (!showAfterEl && !hideAtEl) {
        setPointer(true);
        gsap.set(navEls, { autoAlpha: 1, clearProps: "transform" });
        return;
      }
      if (showAfterEl) hideNav();
      if (showAfterEl && hideAtEl) {
        ScrollTrigger.create({
          id: ST_ID,
          trigger: showAfterEl,
          start: "bottom top",
          endTrigger: hideAtEl,
          end: "top bottom",
          onToggle: (self) => (self.isActive ? showNav() : hideNav()),
          onRefresh: (self) => (self.isActive ? showNav() : hideNav()),
        });
      }
      if (showAfterEl && !hideAtEl) {
        ScrollTrigger.create({
          id: ST_ID,
          trigger: showAfterEl,
          start: "bottom top",
          onEnter: showNav,
          onLeaveBack: hideNav,
          onRefresh: (self) => (self.isActive ? showNav() : hideNav()),
        });
      }
      if (!showAfterEl && hideAtEl) {
        showNav();
        ScrollTrigger.create({
          id: ST_ID,
          trigger: hideAtEl,
          start: "top bottom",
          onEnter: hideNav,
          onLeaveBack: showNav,
        });
      }
      ScrollTrigger.refresh();
      if (!listenersAttached) {
        window.addEventListener("load", onLoad);
        window.addEventListener("resize", onResize);
        listenersAttached = true;
      }
    };
    const mq = window.matchMedia(DISABLE_MQ);
    const applyBreakpoint = () => (mq.matches ? disableForTabletDown() : enableForDesktop());
    applyBreakpoint();
    if (mq.addEventListener) mq.addEventListener('change', applyBreakpoint);
    else mq.addListener(applyBreakpoint);
  }
  window.Webflow ||= [];
  window.Webflow.push(initFixedNavVisibility);
})();
</script>
