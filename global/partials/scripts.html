<script>
  // Lenis instance + global pause/resume helpers
  window.addEventListener('DOMContentLoaded', () => {
    // Reuse existing or create (autoRaf true = Lenis drives its own rAF)
    window.lenis = window.lenis || new Lenis({ autoRaf: true });
    let isPaused = false;
    function applyState(paused) {
      isPaused = paused;
      paused ? window.lenis.stop() : window.lenis.start();
      document.querySelectorAll('[data-scroll-toggle]').forEach((el) => {
        el.setAttribute('aria-pressed', String(paused));
        el.classList.toggle('is-scroll-paused', paused);
      });
      document.documentElement.toggleAttribute('data-scroll-paused', paused);
    }
    document.addEventListener('click', (e) => {
      const toggle = e.target.closest('[data-scroll-toggle]');
      if (!toggle) return;
      const action = (toggle.getAttribute('data-scroll-toggle') || 'toggle').toLowerCase();
      // normalize a few common synonyms
      const resumeVals = new Set(['resume', 'start', 'on', 'enable', 'unpause']);
      const pauseVals = new Set(['pause', 'stop', 'off', 'disable']);
      if (resumeVals.has(action)) {
        if (isPaused) applyState(false);
        return;
      }
      if (pauseVals.has(action)) {
        if (!isPaused) applyState(true);
        return;
      }
      // default: toggle
      applyState(!isPaused);
    });
    window.ScrollPause = {
      pause: () => applyState(true),
      resume: () => applyState(false),
      toggle: () => applyState(!isPaused),
      get paused() {
        return isPaused;
      },
    };

    if (window.ScrollTrigger && typeof window.lenis.on === 'function') {
      window.lenis.on('scroll', () => ScrollTrigger.update());
    }

<script>
  function initLogoRevealLoader() {
    gsap.registerPlugin(CustomEase, SplitText);
    CustomEase.create('loader', '0.65, 0.01, 0.05, 0.99');
    const wrap = document.querySelector('[data-load-wrap]');
    if (!wrap) return;
    const container = wrap.querySelector('[data-load-container]');
    const bg = wrap.querySelector('[data-load-bg]');
    const progressBar = wrap.querySelector('[data-load-progress]');
    const logo = wrap.querySelector('[data-load-logo]');
    const textElements = Array.from(wrap.querySelectorAll('[data-load-text]'));
    const resetTargets = Array.from(wrap.querySelectorAll('[data-load-reset]:not([data-load-text])'));
    const loadTimeline = gsap
      .timeline({
        defaults: { ease: 'loader', duration: 0.75 },
      })
      .set(wrap, { display: 'block' })
      .to(progressBar, { scaleX: 1 })
      .to(logo, { clipPath: 'inset(0% 0% 0% 0%)' }, '<')
      .to(container, { autoAlpha: 0, duration: 0.5 })
      .to(progressBar, { scaleX: 0, transformOrigin: 'right center', duration: 0.5 }, '<')
      .add('hideContent', '<')
      .to(bg, { yPercent: -101, duration: 1 }, 'hideContent')
      .set(wrap, { display: 'none' });
    if (resetTargets.length) {
      loadTimeline.set(resetTargets, { autoAlpha: 1 }, 0);
    }
    if (textElements.length) {
      const firstWord = new SplitText(textElements[0], { type: 'lines,chars', mask: 'lines' });
      gsap.set(firstWord.chars, { autoAlpha: 0, yPercent: 125 });
      gsap.set(textElements, { autoAlpha: 1 });
      loadTimeline.to(
        firstWord.chars,

          autoAlpha: 1,
          yPercent: 0,
          duration: 0.6,
          stagger: { each: 0.02 },
        },
        0,

<script>
  function initImageCycle() {
    document.querySelectorAll('[data-image-cycle]').forEach((cycleElement) => {
      const items = cycleElement.querySelectorAll('[data-image-cycle-item]');
      if (items.length < 2) return;
      let currentIndex = 0;
      let intervalId;
      // Get optional custom duration (in seconds), fallback to 2000ms
      const attrValue = cycleElement.getAttribute('data-image-cycle');
      const duration = attrValue && !isNaN(attrValue) ? parseFloat(attrValue) * 1000 : 2000;
      const isTwoItems = items.length === 2;
      // Initial state
      items.forEach((item, i) => {
        item.setAttribute('data-image-cycle-item', i === 0 ? 'active' : 'not-active');
      });
      function cycleImages() {
        const prevIndex = currentIndex;
        currentIndex = (currentIndex + 1) % items.length;
        items[prevIndex].setAttribute('data-image-cycle-item', 'previous');
        if (!isTwoItems) {
          setTimeout(() => {
            items[prevIndex].setAttribute('data-image-cycle-item', 'not-active');
          }, duration);
        }
        items[currentIndex].setAttribute('data-image-cycle-item', 'active');
      }
      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting && !intervalId) {
            intervalId = setInterval(cycleImages, duration);
          } else {
            clearInterval(intervalId);
            intervalId = null;
          }
        },
        { threshold: 0 },
      );
      observer.observe(cycleElement);
    });
  }
  // Initialize Image Cycle
  document.addEventListener('DOMContentLoaded', function () {
    initImageCycle();
  });
</script>
<script>
(() => {
  const PROP = '--nav-bg-height-override';
  const ATTR = 'data-nav-height';
  const init = () => {
    const root = document.documentElement;
    const toggles = document.querySelectorAll('[data-dropdown-toggle]');
    if (!toggles.length) return;
    toggles.forEach((toggle) => {
      const dropdown = toggle.nextElementSibling;
      const hasDropdown = dropdown && dropdown.classList.contains('nav-dropdown');
      const apply = () => {
        const value = toggle.getAttribute(ATTR);
        if (value) root.style.setProperty(PROP, value);
        else root.style.removeProperty(PROP);
      };
      /* Listen on the toggle and its panel so moving the cursor from the
         link down into the dropdown doesn't drop the value mid-hover. */
      ['pointerenter', 'focusin', 'click'].forEach((evt) => {
        toggle.addEventListener(evt, apply);
        if (hasDropdown) dropdown.addEventListener(evt, apply);
      });
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script>
  (() => {
    'use strict';
    const normalizePath = (path) => {
      if (!path) return '/';
      path = path.split('?')[0].split('#')[0];
      if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
      return path;
    };
    const getPathFromHref = (href) => {
      try {
        const url = new URL(href, window.location.href);
        return normalizePath(url.pathname);
      } catch {
        return null;
      }
    };
    const isSameOrigin = (href) => {
      try {
        const url = new URL(href, window.location.href);
        return url.origin === window.location.origin;
      } catch {
        return false;
      }
    };
    const setCurrentLink = (nav) => {
      const autoCurrentOff = nav.getAttribute('data-dot-auto-current') === 'false';
      if (autoCurrentOff) return;
      const currentPath = normalizePath(window.location.pathname);
      const links = nav.querySelectorAll('[data-dot-link]');
      links.forEach((link) => {
        const href = link.getAttribute('href');
        if (!href || !isSameOrigin(href)) return;
        const linkPath = getPathFromHref(href);
        if (!linkPath) return;
        // Optional section override: match a whole section even when the
        // link points at a page inside it (e.g. href="/services/overview"
        // with data-dot-section="/services").
        const section = link.getAttribute('data-dot-section');
        const basePath = section ? normalizePath(section) : linkPath;
        const matchMode = (link.getAttribute('data-dot-match') || 'exact').toLowerCase();
        let isCurrent = false;
        if (matchMode === 'startswith') {
          isCurrent = currentPath === basePath || (basePath !== '/' && currentPath.startsWith(basePath + '/'));
        } else {
          isCurrent = currentPath === linkPath;
        }
        if (isCurrent) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
    };
    const wireHoverState = (nav) => {
      const links = nav.querySelectorAll('[data-dot-link]');
      let hovered = null;
      const clearHover = () => {
        if (hovered) hovered.removeAttribute('data-dot-hover');
        hovered = null;
        nav.removeAttribute('data-dot-nav-hover');
      };
      const setHover = (link) => {
        if (hovered && hovered !== link) hovered.removeAttribute('data-dot-hover');
        hovered = link;
        nav.setAttribute('data-dot-nav-hover', 'true');
        link.setAttribute('data-dot-hover', 'true');
      };
      links.forEach((link) => {
        link.addEventListener('mouseenter', () => setHover(link));
        link.addEventListener('mouseleave', clearHover);
        link.addEventListener('focus', () => setHover(link));
        link.addEventListener('blur', clearHover);
      });
      nav.addEventListener('mouseleave', clearHover);
    };
    const initNavDots = () => {
      document.querySelectorAll('[data-dot-nav="true"]').forEach((nav) => {
        setCurrentLink(nav);
        wireHoverState(nav);
      });
    };
    document.addEventListener('DOMContentLoaded', initNavDots);
  })();
</script>

<script>
  gsap.registerPlugin(ScrollTrigger);

   ========================= */
  function initFooterParallax() {
    document.querySelectorAll('[data-footer-parallax]').forEach((el) => {
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: el,
          start: 'clamp(top bottom)',
          end: 'clamp(top top)',
          scrub: true,
        },
      });

      const dark = el.querySelector('[data-footer-parallax-dark]');

        tl.from(inner, { yPercent: -25, ease: 'linear' });
      }

        tl.from(dark, { opacity: 0.5, ease: 'linear' }, '<');
      }

  }
  /* =========================
   HORIZONTAL SCROLL (UNCHANGED)
   ========================= */
  function initHorizontalScrolling() {
    const mm = gsap.matchMedia();

      {
        isMobile: '(max-width:479px)',
        isMobileLandscape: '(max-width:767px)',
        isTablet: '(max-width:991px)',
        isDesktop: '(min-width:992px)',
      },
      (context) => {
        const { isMobile, isMobileLandscape, isTablet } = context.conditions;
        const ctx = gsap.context(() => {
          const wrappers = document.querySelectorAll('[data-horizontal-scroll-wrap]');
          if (!wrappers.length) return;
          wrappers.forEach((wrap) => {
            const disable = wrap.getAttribute('data-horizontal-scroll-disable');
            if ((disable === 'mobile' && isMobile) || (disable === 'mobileLandscape' && isMobileLandscape) || (disable === 'tablet' && isTablet)) {
              return;
            }
            const panels = gsap.utils.toArray('[data-horizontal-scroll-panel]', wrap);
            if (panels.length < 2) return;
            gsap.to(panels, {
              x: () => -(wrap.scrollWidth - window.innerWidth),
              ease: 'none',
              scrollTrigger: {
                trigger: wrap,
                start: 'top top',
                end: () => '+=' + (wrap.scrollWidth - window.innerWidth),
                scrub: true,
                pin: true,
                invalidateOnRefresh: true,
              },
            });

    initHorizontalScrolling();
    // 2) Footer second (measured after pin exists)
    initFooterParallax();

    // No load refresh. No delayed refresh during scrolling.
    requestAnimationFrame(() => ScrollTrigger.refresh());

<script>
  function initAccordionCSS() {
    document.querySelectorAll('[data-accordion-css-init]').forEach((accordion) => {
      const closeSiblings = accordion.getAttribute('data-accordion-close-siblings') === 'true';
      accordion.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-accordion-toggle]');
        if (!toggle) return; // Exit if the clicked element is not a toggle
        const singleAccordion = toggle.closest('[data-accordion-status]');
        if (!singleAccordion) return; // Exit if no accordion container is found
        const isActive = singleAccordion.getAttribute('data-accordion-status') === 'active';
        singleAccordion.setAttribute('data-accordion-status', isActive ? 'not-active' : 'active');

        if (closeSiblings && !isActive) {
          accordion.querySelectorAll('[data-accordion-status="active"]').forEach((sibling) => {
            if (sibling !== singleAccordion) sibling.setAttribute('data-accordion-status', 'not-active');
          });
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    initAccordionCSS();
  });

<script>
gsap.registerPlugin(CustomEase, ScrollTrigger);

  document.querySelectorAll("[data-depth-tiles-init]").forEach((container) => {
    const list = container.querySelector("[data-depth-tiles-list]");
    const tiles = container.querySelectorAll("[data-depth-tiles-item]");
    const tileArray = Array.from(tiles);
    const tileCount = tiles.length;
    if (!list || tileCount < 2) return;
    // Read config from custom attributes on [data-depth-tiles-init],
    // falling back to these defaults when the attribute is absent.
    function config(name, fallback) {
      const raw = container.getAttribute(`data-depth-tiles-${name}`);
      if (raw === null || raw.trim() === "") return fallback;
      const value = parseFloat(raw);

    }
    // Which way the fan grows from the active card.
    // "up" (default): active at the bottom, queue stacked above it.
    // "down": active at the top, queue stacked below it.
    const fanDown = (container.getAttribute("data-depth-tiles-direction") || "up").trim().toLowerCase() === "down";
    const dir = fanDown ? 1 : -1;

    const visibleCount = gsap.utils.clamp(2, tileCount, Math.round(config("visible", Math.min(4, tileCount))));
    const fanDepth = visibleCount - 1;

    const travelOverride = config("fan-travel", null);
    const backScale = config("back-scale", 1);
    const backDarkness = config("back-darkness", 0.72);
    const tiltAngle = config("rotate", 5);
    // The exit — active card leaving for the back of the queue
    const exitLift = config("exit-lift", 0.04);
    const exitArc = config("exit-arc", 0.08);
    const exitTilt = config("exit-tilt", 4);
    const exitRotate = config("exit-rotate", 1.5);
    const exitDelay = config("exit-delay", 0.12);
    const exitTuck = config("exit-tuck", 0.15);
    const perspective = config("perspective", 75);
    const moveDuration = config("move-duration", 1.5);
    const pauseDuration = config("pause-duration", 4);
    const startDelay = config("start-delay", 0.5);
    const dragDistance = config("drag-distance", 0.35);
    const dragSensitivity = config("drag-sensitivity", 1);
    const dragMomentum = config("drag-momentum", 0.25);
    const settleDuration = config("settle-duration", 0.6);
    const clickDuration = config("click-duration", 0.9);
    const dragThreshold = 4;
    // Cards only ever need hiding when the deck is larger than the fan.
    const animateOpacity = tileCount > visibleCount;
    const animateScale = backScale !== 1 || exitArc !== 0;
    const animateBrightness = backDarkness !== 1;
    const state = { progress: 0 };
    const metrics = { cardHeight: 0, travel: 0, gap: 0 };
    let isActive = false;
    let isHovering = false;
    let hasStarted = false;
    let isDragging = false;
    let stepTimeline;
    let delayedCall;
    let startDelayedCall;
    let interactionTween;
    let activeTileIndex = -1;
    let pointerId = null;
    let pointerStartY = 0;
    let pointerStartProgress = 0;
    let pointerMoved = false;
    let pointerTile = null;
    let lastMoveTime = 0;
    let lastMoveProgress = 0;
    let dragVelocity = 0;
    // Capture is taken only once a drag actually starts, so a plain
    // click reaches the link inside the card and navigates normally.
    let hasCapture = false;
    let suppressClick = false;

    gsap.set(tiles, {
      transformStyle: "preserve-3d",
      transformPerspective: perspective * 16
    });

    function smooth(x) {
      const t = gsap.utils.clamp(0, 1, x);

          y = slot.y;
          depth = slot.depth;
          opacity = slot.opacity;
          tilt = tiltAngle * (1 - depth);

          dip = 0;
          layer = Math.min(relative, fanDepth);

        delayedCall = null;
      }

        startDelayedCall.kill();

        paused: true,
        onComplete: () => {

      if (isHovering || isDragging) return;

        interactionTween.play();
        return;

        hasStarted = true;

        goToNextTile();

      isHovering = true;
      if (delayedCall) delayedCall.pause();
      if (startDelayedCall) startDelayedCall.pause();
    }

      isHovering = false;
      if (!isActive || isDragging) return;
      if (interactionTween && interactionTween.progress() < 1) {
        interactionTween.play();
        return;

        playDepth();

        stepTimeline.play();

        goToNextTile();

      trigger: container,
      start: "top bottom",
      end: "bottom top",
      onToggle: (self) => self.isActive ? playDepth() : pauseDepth()

}

});
