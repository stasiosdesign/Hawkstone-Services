<!-- Shared service component: Service CTA Bar (consultation pill; copies the fluid.glass bottom bar). Fixed at the
     bottom centre once the hero's own button has scrolled away, and hidden again while the footer is in view. The unit
     is a back-to-top square (left) and the consultation pill (right): the Hawkstone mark (the logo cropped to its
     building mark), a hairline, the label and the arrow in a square, linking to the contact page. The whole unit is
     centred. Parameter: label. Styles: service-cta-bar* and service-cta-pill* in shared/css/service-pages.css.
     Behaviour: shared/custom-js/service-cta-bar.js (toggles the is-hidden combo class; the square scrolls to the top). -->
<div data-migrate-component="Service CTA Bar" data-service-cta-bar="" class="service-cta-bar is-hidden">
  <button type="button" data-service-cta-top="" aria-label="Back to top" class="service-cta-bar_top"><img src="../images/arrow-white.svg" alt="" class="service-cta-bar_top-icon"></button>
  <a href="/contact" class="service-cta-pill w-inline-block">
    <span class="service-cta-pill_mark"><img src="../images/Transparent-Logo-Thin-2_1.avif" alt="Hawkstone Developments" class="service-cta-pill_logo"></span>
    <span class="service-cta-pill_text">{{label}}</span>
    <span class="service-cta-pill_square"><img src="../images/arrow-white.svg" alt="" class="service-cta-pill_icon"></span>
  </a>
</div>
